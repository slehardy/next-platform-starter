version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      routine-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "10:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 3
    groups:
      security-updates:
        applies-to: security-updates
        patterns: ["*"]
      routine-updates:
        applies-to: version-updates
        patterns: ["*"]
        update-types: ["minor", "patch"]
